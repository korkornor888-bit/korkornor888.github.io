<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F5F5F7">
<title>ระบบจัดการงาน — ฝ่ายนโยบาย</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*{scrollbar-width:thin;scrollbar-color:rgba(249,115,22,.35) transparent}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(249,115,22,.35);border-radius:99px}
::-webkit-scrollbar-track{background:transparent}
:root{
  --ink:#1C1C1F; --ink-soft:#52525B; --ink-mute:#8A8A94;
  --line:rgba(20,20,25,.09); --line-soft:rgba(20,20,25,.05); --surface:#FFFFFF; --canvas:#F5F5F7;
  --brand:#F97316; --brand-strong:#FB923C; --brand-wash:rgba(249,115,22,.12);
  --good:#16A34A; --good-wash:rgba(22,163,74,.11);
  --warn:#2563EB; --warn-wash:rgba(37,99,235,.10);
  --risk:#D97706; --risk-wash:rgba(217,119,6,.12);
  --bad:#DC2626; --bad-wash:rgba(220,38,38,.10); --bad-line:rgba(220,38,38,.32);
  --radius-lg:20px; --radius-md:16px; --radius-sm:12px; --radius-pill:999px;
  --shadow-card:0 1px 2px rgba(20,20,25,.04), 0 10px 24px -14px rgba(20,20,25,.14);
  --shadow-pop:0 20px 50px -16px rgba(20,20,25,.28);
  --focus-ring:0 0 0 3px rgba(249,115,22,.30);
}
html{-webkit-text-size-adjust:100%;overflow-x:hidden}
*::selection{background:var(--brand-wash);color:var(--brand-strong)}
body{
  font-family:'Sarabun','Noto Sans Thai',Tahoma,'Segoe UI',system-ui,sans-serif;
  margin:0;background:var(--canvas);color:var(--ink);font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  padding-bottom:env(safe-area-inset-bottom);
  overflow-wrap:break-word;
  overflow-x:hidden;
  min-height:100vh;
  min-height:100dvh;
}
img,svg{max-width:100%;display:block}

/* -- focus & interactive states (accessibility) -- */
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,
textarea:focus-visible,[tabindex]:focus-visible{
  outline:none;box-shadow:var(--focus-ring);border-radius:6px;
}
.btn:focus-visible{box-shadow:var(--focus-ring)}

.wrap{max-width:760px;margin:0 auto;padding:18px 16px 48px;min-width:0}
@media(min-width:768px){.wrap{max-width:820px;padding:26px 24px 56px}}
@media(min-width:1100px){.wrap{max-width:880px;padding:32px 24px 64px}}
@media(min-width:1400px){.wrap{max-width:960px;padding:36px 24px 72px}}

.top{
  background:rgba(255,255,255,.82);backdrop-filter:saturate(180%) blur(14px);-webkit-backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:14px 18px;
  padding-top:calc(14px + env(safe-area-inset-top));
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  position:sticky;top:0;z-index:20;flex-wrap:wrap;row-gap:8px;
}
@media(min-width:768px){.top{padding:16px 28px}}
.top h1{font-size:16.5px;margin:0;letter-spacing:-.01em;font-weight:700;color:var(--ink);overflow-wrap:anywhere}
.who{font-size:11.5px;color:var(--ink-mute);margin-top:1px;font-weight:500}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:40px;min-width:40px;padding:9px 17px;font-size:13.5px;font-weight:600;
  border-radius:var(--radius-pill);border:none;cursor:pointer;font-family:inherit;
  letter-spacing:-.005em;transition:background-color .15s ease,border-color .15s ease,transform .08s ease,box-shadow .15s ease;
  white-space:nowrap;
}
@media(pointer:coarse){.btn{min-height:44px}}
.btn:active{transform:scale(.97)}
.bp{background:linear-gradient(180deg,var(--brand-strong),var(--brand));color:#fff;box-shadow:0 6px 18px -6px rgba(249,115,22,.45)}
.bg{background:var(--surface);color:var(--ink-soft);border:1px solid var(--line)}
.bd{background:transparent;color:var(--ink-mute);border:1px solid var(--line);margin-left:auto}
.bd:hover,.bd:active{color:var(--bad);border-color:var(--bad-line)}
.bs{background:var(--good);color:#fff;box-shadow:0 6px 18px -6px rgba(22,163,74,.4)}

.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);
  padding:18px;margin-bottom:12px;position:relative;box-shadow:var(--shadow-card);
  min-width:0;overflow:hidden;
}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(180deg,rgba(20,20,25,.02),transparent 45%);pointer-events:none}
@media(min-width:768px){.card{padding:22px}}
.card[onclick]{cursor:pointer;transition:border-color .16s ease,box-shadow .16s ease,transform .08s ease}
.card[onclick]:active{transform:scale(.994)}

.chip{
  display:inline-block;background:var(--line-soft);color:var(--ink-soft);
  font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);margin-right:6px;
  letter-spacing:.01em;white-space:nowrap;
}
.kind{display:inline-block;font-size:11px;font-weight:700;padding:3px 10px;border-radius:var(--radius-pill);letter-spacing:.01em;white-space:nowrap}
.k-i{background:var(--warn-wash);color:var(--warn)}
.k-p{background:var(--brand-wash);color:var(--brand-strong)}
.badge{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-pill);background:var(--brand-wash);color:var(--brand-strong);letter-spacing:.01em;white-space:nowrap}
.stale{display:inline-block;font-size:11px;font-weight:700;padding:4px 11px;border-radius:var(--radius-pill);background:var(--bad-wash);color:var(--bad);margin-left:6px;letter-spacing:.01em;white-space:nowrap}
.muted{color:var(--ink-mute);font-size:12.5px;line-height:1.5}

.quick{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-bottom:14px}
@media(max-width:600px){.quick{grid-template-columns:repeat(2,1fr)}}
.q{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 10px;text-align:center;box-shadow:var(--shadow-card);min-width:0;position:relative;overflow:hidden}
.q::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(20,20,25,.02),transparent 45%);pointer-events:none}
.q b{display:block;font-size:23px;line-height:1.15;font-weight:700;letter-spacing:-.02em;background:linear-gradient(180deg,var(--brand-strong),var(--brand));-webkit-background-clip:text;background-clip:text;color:transparent}
.q span{font-size:11px;color:var(--ink-mute);font-weight:600;overflow-wrap:break-word}

.filters{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
@media(max-width:899px){.filters{grid-template-columns:1fr 1fr}}
@media(max-width:480px){.filters{grid-template-columns:1fr}}

.strip{display:flex;gap:4px;margin-top:12px}
.strip i{flex:1;height:6px;border-radius:99px;background:var(--line-soft);font-style:normal;min-width:4px}
.strip i.on{background:linear-gradient(90deg,var(--brand),var(--brand-strong))}

.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-lg);margin-bottom:12px;overflow:hidden;box-shadow:var(--shadow-card)}
.sec-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;cursor:pointer;user-select:none;font-weight:700;font-size:14.5px;letter-spacing:-.005em;gap:10px;min-height:44px}
.sec-h span:first-child{min-width:0;overflow-wrap:break-word}
.sec-h .ar{color:var(--brand);font-size:11px;transition:transform .2s ease;flex:none}
.sec.open .sec-h .ar{transform:rotate(90deg)}
.sec-b{padding:0 18px 18px;display:none;min-width:0}
.sec.open .sec-b{display:block;animation:fadeIn .15s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

.done{font-size:11.5px;color:var(--good);font-weight:600;background:transparent;padding:0;border:none;margin:1px 0 16px;display:flex;align-items:flex-start;gap:5px;line-height:1.45}

.entry{border-left:3px solid var(--line);padding:9px 0 9px 12px;margin-bottom:9px;min-width:0}
.tl-stage-h{font-size:12px;font-weight:700;padding:6px 0 6px 12px;border-left:3px dashed var(--line);margin:14px 0 4px}
.tl-stage-h:first-child{margin-top:0}
.entry.has-contact{border-left-color:var(--brand)}
.entry .r1{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
.entry .ti{font-weight:600;font-size:13.5px;color:var(--ink);overflow-wrap:break-word}
.entry .dt{font-size:11px;color:var(--ink-mute);white-space:nowrap;font-weight:500}
.list-row .ti{font-size:14.5px}
.list-icon-btn{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-size:14.5px;cursor:pointer;background:var(--surface);flex:none;padding:0;transition:background-color .12s ease,transform .1s ease}
.list-icon-btn.del{color:var(--bad);border-color:var(--bad-line);background:var(--bad-wash)}
.list-icon-btn:active{transform:scale(.92)}
.entry .de{font-size:12.5px;color:var(--ink-soft);margin-top:3px;white-space:pre-wrap;line-height:1.5;overflow-wrap:break-word}
.entry .ct{display:inline-block;font-size:11px;background:var(--warn-wash);color:var(--warn);padding:2px 9px;border-radius:var(--radius-pill);margin-top:5px;font-weight:600}
.entry .sg{display:inline-block;font-size:10.5px;background:var(--brand-wash);color:var(--brand-strong);padding:2px 9px;border-radius:var(--radius-pill);margin-right:6px;font-weight:700}

.stg-title{font-weight:700;font-size:16px;margin-bottom:3px;letter-spacing:-.01em;color:var(--ink);overflow-wrap:break-word}

label{display:block;font-size:12.5px;font-weight:600;color:var(--ink-soft);margin:14px 0 6px}
input,textarea{
  width:100%;padding:10px 13px;font-size:16px;font-family:inherit;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--canvas);
  color:var(--ink);transition:border-color .12s ease,box-shadow .12s ease;min-width:0;
}
select{
  width:100%;padding:10px 34px 10px 13px;font-size:16px;font-family:inherit;
  border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--canvas);
  color:var(--ink);transition:border-color .12s ease,box-shadow .12s ease;min-width:0;
  appearance:none;-webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20' fill='%2352525B'><path fill-rule='evenodd' d='M5.23 7.21a.75.75 0 011.06.02L10 10.94l3.71-3.71a.75.75 0 111.06 1.06l-4.24 4.25a.75.75 0 01-1.06 0L5.21 8.29a.75.75 0 01.02-1.08z' clip-rule='evenodd'/></svg>");
  background-repeat:no-repeat;background-position:right 11px center;background-size:16px;
}
input::placeholder,textarea::placeholder{color:#A8A8B0}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3.5px var(--brand-wash)}
textarea{min-height:64px;resize:vertical;line-height:1.5}

.radios{display:flex;flex-wrap:wrap;gap:7px}
.radio{padding:7px 14px;min-height:32px;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:var(--radius-pill);font-size:12.5px;font-weight:500;cursor:pointer;background:var(--surface);transition:background-color .12s ease,border-color .12s ease,transform .1s ease;max-width:100%;overflow-wrap:break-word;color:var(--ink-soft)}
.radio.on{background:linear-gradient(180deg,var(--brand-strong),var(--brand));color:#fff;border-color:var(--brand);font-weight:700}
.radio:active{transform:scale(.94)}
.sec-h:active{background:rgba(20,20,25,.05)}
.hbtn:active{transform:scale(.92)}
.xdel:active{transform:scale(.93)}

.tag{display:inline-flex;align-items:center;gap:6px;background:var(--brand-wash);color:var(--brand-strong);font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:var(--radius-pill);margin:3px 5px 0 0;max-width:100%}
.tag span{overflow-wrap:break-word}
.tag b{cursor:pointer;font-weight:700;opacity:.7;flex:none;padding:2px 4px}

.sug{border:1px solid var(--line);border-radius:var(--radius-sm);margin-top:5px;max-height:160px;overflow-y:auto;box-shadow:var(--shadow-pop);background:var(--surface)}
.sug div{padding:9px 12px;cursor:pointer;font-size:12.5px;border-bottom:1px solid var(--line-soft);overflow-wrap:break-word}
.sug div:last-child{border-bottom:none}

.center{text-align:center;padding:40px 16px;color:var(--ink-mute);font-size:13.5px}
.hidden{display:none!important}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--brand-wash);border-top-color:var(--brand);border-radius:50%;animation:sp .7s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

.toast{
  position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  background:#1C1C1F;color:#fff;padding:11px 20px;border-radius:var(--radius-pill);
  border:1px solid rgba(255,255,255,.08);
  font-size:13.5px;font-weight:500;z-index:60;max-width:88vw;box-shadow:var(--shadow-pop);
  animation:toastIn .18s ease;overflow-wrap:break-word;text-align:center;
}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
@media(min-width:640px){.toast{left:auto;right:22px;bottom:calc(22px + env(safe-area-inset-bottom));transform:none;max-width:360px}
  @keyframes toastIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}}

.err{background:var(--bad-wash);color:var(--bad);border:1px solid var(--bad-line);padding:13px 14px;border-radius:var(--radius-sm);font-size:13.5px;line-height:1.5;overflow-wrap:break-word}

.login-wrap{min-height:100vh;min-height:100dvh;display:flex;background:var(--surface)}
.login-hero{
  flex:1;display:flex;flex-direction:column;justify-content:center;padding:48px;color:#fff;min-width:0;
  background:
    radial-gradient(900px 500px at 15% 0%, rgba(255,255,255,.16), transparent 60%),
    linear-gradient(155deg,#F97316 0%,#EA580C 55%,#C2410C 100%);
}
.login-hero h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0 0 10px;line-height:1.2}
.login-hero p{font-size:14.5px;opacity:.92;max-width:360px;line-height:1.6;margin:0 0 26px}
.login-glass{background:rgba(255,255,255,.14);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-lg);padding:18px 20px;max-width:340px}
.login-glass b{display:block;font-size:26px;font-weight:800}
.login-glass span{font-size:12px;opacity:.9}
@media(max-width:767px){.login-hero{display:none}}
.login-form-side{flex:1;display:flex;align-items:center;justify-content:center;padding:24px;min-width:0}
.login-card{background:var(--surface);border-radius:var(--radius-lg);padding:8px 4px;max-width:380px;width:100%;min-width:0}
@media(min-width:768px){.login-card{padding:8px}}
.login-card h2{margin:0 0 6px;font-size:22px;text-align:left;letter-spacing:-.02em;font-weight:800;color:var(--ink)}
.login-card p{color:var(--ink-mute);font-size:13.5px;margin:0 0 22px;text-align:left}

.tabs{display:flex;align-items:flex-start;counter-reset:step;margin-bottom:6px;position:relative;padding:2px 2px 0}
.tabs::before{content:"";position:absolute;top:17px;left:calc(50%/4);right:calc(50%/4);height:2px;background:var(--line-soft);z-index:0}
.tab{flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:5px;cursor:pointer;position:relative;z-index:1;font-size:10.5px;font-weight:600;color:var(--ink-mute);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:color .12s ease;background:transparent;padding:0}
.tab::before{counter-increment:step;content:counter(step);width:34px;height:34px;flex:none;border-radius:50%;background:var(--surface);border:2px solid var(--line);color:var(--ink-mute);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;transition:background-color .15s ease,border-color .15s ease,color .15s ease,box-shadow .15s ease}
.tab:active{transform:scale(.97)}
.tab.on{color:var(--brand)}
.tab.on::before{background:linear-gradient(180deg,var(--brand-strong),var(--brand));border-color:var(--brand);color:#fff;box-shadow:0 6px 16px -6px rgba(249,115,22,.45)}
.tab-name{font-size:9.5px;font-weight:600;max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab-hint{font-size:12px;color:var(--ink-mute);font-weight:600;text-align:center;margin:0 0 16px}

/* -- health badge (On Track / At Risk / Off Track) -- */
.hbadge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 10px;border-radius:var(--radius-pill);white-space:nowrap}
.hbadge::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;flex:none}
.hb-good{background:var(--good-wash);color:var(--good)}
.hb-risk{background:var(--risk-wash);color:var(--risk)}
.hb-bad{background:var(--bad-wash);color:var(--bad)}

/* -- KPI target/actual rows -- */
.kpi-row{background:var(--canvas);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
/* -- policy tag box -- */
.tagbox{background:var(--canvas);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;margin:14px 0 8px}
.tagbox-h{font-size:12.5px;font-weight:600;color:var(--ink-soft);margin-bottom:8px}
.tagbox-add{width:28px;height:28px;border-radius:var(--radius-pill);border:1px dashed var(--line);background:transparent;color:var(--ink-mute);font-size:16px;line-height:1;cursor:pointer;vertical-align:middle}
#tagPanel{margin-top:8px;border-top:1px solid var(--line);padding-top:8px;max-height:220px;overflow-y:auto}
.tag-panel-item{padding:9px 8px;border-radius:var(--radius-sm);font-size:13.5px;cursor:pointer;color:var(--ink);transition:background-color .1s ease}
.tag-panel-item:active{background:var(--brand-wash)}
.tag-panel-item:first-child{color:var(--brand);font-weight:600}
.kpi-top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:600;color:var(--ink)}
.kpi-top b{font-weight:700;color:var(--brand)}
.kpi-bar{height:6px;border-radius:99px;background:var(--line-soft);margin-top:7px;overflow:hidden}
.kpi-bar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-strong));border-radius:99px;font-style:normal}

/* -- app shell: off-canvas drawer menu with hamburger toggle -- */
.shell{position:relative}
.shell .top{padding-left:64px}
.hbtn{
  position:fixed;top:14px;left:14px;z-index:41;width:40px;height:40px;border-radius:12px;
  background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:var(--shadow-card);padding:0;
}
.hbtn .hbar{width:18px;height:2px;background:var(--ink);border-radius:2px;transition:transform .2s ease,opacity .2s ease}
.drawer-backdrop{position:fixed;inset:0;background:rgba(20,20,25,.4);z-index:39;opacity:0;pointer-events:none;transition:opacity .22s ease}
.drawer-backdrop.show{opacity:1;pointer-events:auto}
.rail{
  position:fixed;top:0;left:0;bottom:0;width:230px;background:var(--surface);border-right:1px solid var(--line);
  display:flex;flex-direction:column;align-items:stretch;padding:66px 12px 20px;gap:3px;z-index:40;
  transform:translateX(-100%);transition:transform .25s cubic-bezier(.4,0,.2,1);overflow-y:auto;
}
.rail.open{transform:translateX(0)}
@media(max-width:480px){.rail{width:80vw}}
.rbtn{
  width:100%;flex-direction:row;justify-content:flex-start;gap:10px;padding:11px 12px;
  font-size:13.5px;font-weight:600;color:var(--ink-mute);cursor:pointer;background:transparent;border:none;
  border-radius:12px;font-family:inherit;text-align:left;transition:background-color .12s ease,color .12s ease;
}
.rbtn span{overflow-wrap:break-word}
.rbtn.on{background:var(--brand-wash);color:var(--brand)}
.rbtn:active{transform:scale(.98)}
.content{min-width:0}

.xdel{position:absolute;top:14px;right:14px;font-size:11px;font-weight:600;color:var(--bad);background:var(--bad-wash);border:1px solid var(--bad-line);border-radius:var(--radius-pill);padding:5px 11px;min-height:28px;display:inline-flex;align-items:center;cursor:pointer;transition:background-color .12s ease;z-index:2}

table.ftbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.ftbl th{text-align:left;border-bottom:1px solid var(--line);padding:7px 10px;white-space:nowrap;background:var(--line-soft);font-weight:700;color:var(--ink-soft)}
table.ftbl td{border-bottom:1px solid var(--line-soft);padding:7px 10px;white-space:nowrap;color:var(--ink-soft)}
table.ftbl tr:last-child td{border-bottom:none}

@media(prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}

    });
    window._fieldsByCode = byCode;
    drawHome();
  });
}
function isStale(w) { return (Date.now() - new Date(w.updated_at).getTime()) > STALE_MS; }
function kpiListOf(fmap) { try { return JSON.parse((fmap || {})["0|KPI_LIST"] || "[]") || []; } catch (e) { return []; } }
function healthBadge(w, fmap) {
  var problem = ((fmap || {})["3|ปัญหาที่พบ"] || "").trim();
  var rejected = (fmap || {})["2|ผลการตัดสินใจ"] === "ไม่อนุมัติ";
  if (problem || rejected || w.status === "ติดขัด/มีปัญหา") return { cls: "bad", label: "Off Track" };
  if (isStale(w)) return { cls: "risk", label: "At Risk" };
  return { cls: "good", label: "On Track" };
}
function aggregateKpi() {
  var t = 0, a = 0;
  var byCode = window._fieldsByCode || {};
  Object.keys(byCode).forEach(function (code) {
    kpiListOf(byCode[code]).forEach(function (k) {
      if (k.type === "text") return;
      t += Number(k.target) || 0; a += Math.max(0, Number(k.actual) || 0);
    });
  });
  return { target: t, actual: a, pct: t > 0 ? Math.round(a / t * 100) : 0 };
}
function projectProgress(w) {
  var fmap = (window._fieldsByCode || {})[w.code] || {};
  var flow = FLOW[KIND_PROJECT];
  var filled = flow.filter(function (stage) {
    return stage.fields.every(function (fd) {
      var v = fmap[stage.n + "|" + fd.key] || "";
      if (fd.type === "list") { try { return (JSON.parse(v || "[]") || []).length > 0; } catch (e) { return false; } }
      return v.trim && v.trim().length > 0;
    });
  }).length;
  return { filled: filled, total: flow.length };
}
function progressLabel(p, flow) {
  if (p.filled === 0) return "ยังไม่เริ่ม";
  if (p.filled >= p.total) return "เสร็จสมบูรณ์ครบทุกขั้น";
  return "อยู่ระหว่างขั้น " + (p.filled + 1) + " — " + flow[p.filled].name;
}

  ];

    return '<div class="q"><b>' + t.val + '</b><span>' + esc(t.label) + '</span></div>';
  }).join("") + '</div>';

  html += '<div style="display:flex;gap:6px;margin-bottom:10px">' +
    '<button type="button" class="btn ' + (HOME_VIEW === "card" ? "bp" : "bg") + '" onclick="HOME_VIEW=\'card\';drawHome()">การ์ด</button>' +
    '<button type="button" class="btn ' + (HOME_VIEW === "table" ? "bp" : "bg") + '" onclick="HOME_VIEW=\'table\';drawHome()">ตาราง</button>' +
    '<button type="button" class="btn ' + (SELECT_MODE ? "bp" : "bg") + '" style="margin-left:auto" onclick="SELECT_MODE=!SELECT_MODE;SELECTED.clear();drawHome()">เลือกหลายรายการ</button></div>';

  var owners = Array.from(new Set(works.map(function (w) { return w.owner; }))).sort();
  var allTagsHome = Array.from(new Set(Object.keys(window._fieldsByCode || {}).reduce(function (acc, code) {
    return acc.concat(((window._fieldsByCode[code] || {})["0|นโยบาย"] || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean));
  }, []))).sort();
  html += '<div class="filters">' +
    '<select onchange="F_KIND=this.value;drawHome()"><option value="">ประเภททั้งหมด</option>' +
    [KIND_ISSUE, KIND_PROJECT].map(function (k) { return '<option' + (F_KIND === k ? " selected" : "") + '>' + esc(k) + '</option>'; }).join("") + '</select>' +

    ISSUE_STATUS.concat(PROJECT_STATUS).map(function (s) { return '<option' + (F_STATUS === s ? " selected" : "") + '>' + esc(s) + '</option>'; }).join("") + '</select>' +
    '<select onchange="F_TAG=this.value;drawHome()"><option value="">แท็กทั้งหมด</option>' +
    allTagsHome.map(function (t) { return '<option' + (F_TAG === t ? " selected" : "") + '>' + esc(t) + '</option>'; }).join("") + '</select></div>';

  html += '<div style="margin-bottom:9px"><input placeholder="ค้นหาชื่องาน…" value="' + esc(F_SEARCH) + '" oninput="onSearchInput(this.value)"></div>';
  html += '<div style="display:flex;gap:8px;margin-bottom:11px">' +
    '<div class="card" style="flex:1;text-align:center;cursor:pointer;color:var(--brand,#4f46e5);font-weight:600;margin-bottom:0" onclick="showCreate(\'' + KIND_ISSUE + '\')">+ ประเด็นปัญหาใหม่</div>' +
    '<div class="card" style="flex:1;text-align:center;cursor:pointer;color:var(--brand,#4f46e5);font-weight:600;margin-bottom:0" onclick="showCreate(\'' + KIND_PROJECT + '\')">+ โครงการใหม่</div>' +
    '</div>';

  var q = F_SEARCH.trim().toLowerCase();

    if (F_KIND && w.kind !== F_KIND) return false;

  FLOW[KIND_PROJECT].forEach(function (stage) {
    stage.fields.forEach(function (fd) {
      var mapKey = stage.n + "|" + fd.key;
      if (fd.type === "list") {
        var arr = logEntries(stage.n, fd.key);
        arr.forEach(function (item, idx) {
          var title = fd.key === "ทางเลือกที่พิจารณา" ? ordinalTitle("เสนอทางเลือก", idx) :
            (fd.key === "ความคืบหน้าตอนนี้" ? "ความคืบหน้า" : fd.key);
          out.push({ stage: stage.n, stageName: stage.name, title: title, detail: item.text, date: item.date, real: false });
        });
        return;
      }
      if (AUTO_TITLE[mapKey] === null) return;
      var val = D.fields[mapKey] || "";
      if (!val || !String(val).trim()) return;
      out.push({ stage: stage.n, stageName: stage.name, title: AUTO_TITLE[mapKey] || fd.key, detail: val,

/* ---- Google Form (linked Sheet CSV) fetch + table ---- */
function extractSheetId(url) { var m = url.match(/\/d\/([a-zA-Z0-9-_]+)/); return m ? m[1] : null; }
function parseCSV(text) {
  var rows = [], row = [], field = "", inQ = false;
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else inQ = false; }
      else field += c;
    } else {
      if (c === '"') inQ = true;
      else if (c === ",") { row.push(field); field = ""; }
      else if (c === "\n") { row.push(field); rows.push(row); row = []; field = ""; }
      else if (c === "\r") { }
      else field += c;
    }
  }
  if (field.length || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function loadFormTable(id) {
  var url = document.getElementById(id).value.trim();
  var box = document.getElementById(id + "_result");
  if (!url) { toast("ใส่ลิงก์ก่อน"); return; }
  box.innerHTML = '<span class="spin"></span> กำลังดึงข้อมูล…';
  var sid = extractSheetId(url);
  if (!sid) { box.innerHTML = '<div class="err">ไม่พบรหัสชีตในลิงก์ ตรวจว่าเป็นลิงก์ Google Sheet</div>'; return; }
  var csvUrl = "https://docs.google.com/spreadsheets/d/" + sid + "/export?format=csv";
  fetch(csvUrl).then(function (r) {
    if (!r.ok) throw new Error('โหลดไม่สำเร็จ (โค้ด ' + r.status + ') — เช็คว่าตั้งค่าแชร์เป็น "ใครมีลิงก์ก็ดูได้" แล้วหรือยัง');
    return r.text();
  }).then(function (text) {
    var rows = parseCSV(text);
    renderFormTable(box, id, rows);
  }).catch(function (e) { box.innerHTML = '<div class="err">' + esc(e.message) + '</div>'; });
}
function renderFormTable(box, id, rows) {
  if (!rows.length) { box.innerHTML = '<div class="muted">ไม่มีข้อมูล</div>'; return; }
  var headers = rows[0], data = rows.slice(1).filter(function (r) { return r.length > 1 || r[0]; });
  var html = '<div class="muted">ผู้ตอบทั้งหมด ' + data.length + ' คน</div>';
  html += headers.map(function (h, i) {
    var cnt = data.filter(function (r) { return (r[i] || "").trim(); }).length;
    return '<div class="muted" style="margin-top:2px">• ' + esc(h) + ' (' + cnt + ' ตอบ)</div>';
  }).join("");
  html += '<button type="button" class="btn bg" style="margin-top:7px" onclick="toggleFormDetail(\'' + id + '\')">ดูรายละเอียด</button>';
  html += '<div id="' + id + '_detail" class="hidden" style="overflow-x:auto;margin-top:8px"><table class="ftbl">' +
    '<tr>' + headers.map(function (h) { return '<th>' + esc(h) + '</th>'; }).join("") + '</tr>' +
    data.map(function (r) { return '<tr>' + headers.map(function (h, i) { return '<td>' + esc(r[i] || "") + '</td>'; }).join("") + '</tr>'; }).join("") +
    '</table></div>';
  box.innerHTML = html;
}

function allTagNamesGlobal() {
  var set = {};
  (window._tagRows || []).forEach(function (row) { row.value.split(",").forEach(function (t) { t = t.trim(); if (t) set[t] = true; }); });
  return Object.keys(set).sort();
}
var TAG_EDITING = null;
function drawTags() {
  var tags = allTagNamesGlobal();
  var box = document.getElementById("tagsBody");
  if (!tags.length) { box.innerHTML = '<div class="center">ยังไม่มีแท็กในระบบ — ไปเพิ่มแท็กได้จากหน้ารายละเอียดงาน</div>'; return; }
  box.innerHTML = tags.map(function (t) {
    var count = (window._tagRows || []).filter(function (row) { return row.value.split(",").map(function (s) { return s.trim(); }).indexOf(t) >= 0; }).length;
    var tEsc = esc(t).replace(/'/g, "\\'");
    if (TAG_EDITING === t) {
      return '<div class="card" style="display:flex;gap:8px;align-items:center">' +
        '<input id="tagEditInput" value="' + esc(t) + '" style="flex:1" onkeydown="if(event.key==\'Enter\')saveTagRename(\'' + tEsc + '\')">' +
        '<button type="button" class="btn bp" style="padding:9px 14px" onclick="saveTagRename(\'' + tEsc + '\')">บันทึก</button>' +
        '<button type="button" class="btn bg" style="padding:9px 14px" onclick="TAG_EDITING=null;drawTags()">ยกเลิก</button></div>';
    }
    return '<div class="card" style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">' +
      '<div><span class="chip">' + esc(t) + '</span> <span class="muted">ใช้อยู่ ' + count + ' งาน</span></div>' +
      '<div style="display:flex;gap:6px">' +
      '<button type="button" class="btn bg" style="padding:8px 12px" onclick="TAG_EDITING=\'' + tEsc + '\';drawTags()" aria-label="แก้ไข">✎</button>' +
      '<button type="button" class="btn bd" style="padding:8px 12px" onclick="deleteTagEverywhere(\'' + tEsc + '\')" aria-label="ลบ">✕</button>' +
      '</div></div>';
  }).join("");
  var el = document.getElementById("tagEditInput"); if (el) { el.focus(); el.select(); }
}
function saveTagRename(oldName) {
  var el = document.getElementById("tagEditInput");
  var newName = el ? el.value.trim() : "";
  if (!newName || newName === oldName) { TAG_EDITING = null; drawTags(); return; }
  var rows = (window._tagRows || []).filter(function (row) { return row.value.split(",").map(function (s) { return s.trim(); }).indexOf(oldName) >= 0; });
  var updates = rows.map(function (row) {
    var arr = row.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean);
    var idx = arr.indexOf(oldName);
    if (idx >= 0) { if (arr.indexOf(newName) < 0) arr[idx] = newName; else arr.splice(idx, 1); }
    row.value = arr.join(", ");
    return sb.from("fields").update({ value: row.value, updated_at: new Date().toISOString() }).eq("code", row.code).eq("stage", 0).eq("key", "นโยบาย");
  });
  Promise.all(updates).then(function (results) {
    var err = results.filter(function (r) { return r && r.error; })[0];
    if (err) toast(err.error.message); else toast("เปลี่ยนชื่อแท็กแล้ว");
    TAG_EDITING = null; drawTags();
  });
}
function deleteTagEverywhere(t) {
  if (!confirm('ลบแท็ก "' + t + '" ออกจากทุกงานที่มี? (แท็กอื่นของงานเดียวกันจะยังอยู่)')) return;
  var rows = (window._tagRows || []).filter(function (row) { return row.value.split(",").map(function (s) { return s.trim(); }).indexOf(t) >= 0; });
  var updates = rows.map(function (row) {
    row.value = row.value.split(",").map(function (s) { return s.trim(); }).filter(Boolean).filter(function (x) { return x !== t; }).join(", ");
    return sb.from("fields").update({ value: row.value, updated_at: new Date().toISOString() }).eq("code", row.code).eq("stage", 0).eq("key", "นโยบาย");
  });
  Promise.all(updates).then(function (results) {
    var err = results.filter(function (r) { return r && r.error; })[0];
    if (err) toast(err.error.message); else toast("ลบแท็กแล้ว");
    drawTags();
  });
}

  if (!items.length) { box.innerHTML = '<div class="center">คลังว่างเปล่า</div>'; return; }
  box.innerHTML = items.map(function (w) {
    return '<div class="card">' +
      '<label style="position:absolute;top:13px;left:13px" onclick="event.stopPropagation()"><input type="checkbox" onclick="toggleSelect(\'' + esc(w.code) + '\',this.checked);drawArchive()" ' + (SELECTED.has(w.code) ? "checked" : "") + ' style="width:18px;height:18px;margin:0;cursor:pointer"></label>' +
      '<div style="padding-left:28px"><span class="kind ' + (w.kind === KIND_ISSUE ? "k-i" : "k-p") + '">' + esc(w.kind) + '</span> <span class="chip">' + esc(w.code) + '</span>' +
      '<div style="font-weight:600;margin-top:5px">' + esc(w.name) + '</div>' +
      '<div style="margin-top:8px"><button class="btn bg" onclick="unarchiveWork(\'' + esc(w.code) + '\')">นำกลับมาใช้งาน</button></div></div></div>';
  }).join("");
  var bar = document.getElementById("bulkBar"); if (bar) bar.remove();
  if (SELECTED.size > 0) {
    var b = document.createElement("div");
    b.id = "bulkBar";
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#111827;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 12px 32px -12px rgba(17,24,39,.5);z-index:55;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:92vw;justify-content:center";
    b.innerHTML = '<span style="font-size:13px;font-weight:600">เลือกแล้ว ' + SELECTED.size + ' รายการ</span>' +
      '<button style="background:#fff;color:#111827;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="bulkUnarchive()">นำกลับมาใช้งาน</button>' +
      '<button style="background:#fca5a5;color:#7f1d1d;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="bulkPermanentDelete(\'arch\')">ลบถาวรที่เลือก</button>' +
      '<button style="background:transparent;color:#cbd5e1;border:1px solid #374151;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="SELECTED.clear();drawArchive()">ยกเลิก</button>';
    document.body.appendChild(b);
  }
}
function unarchiveWork(code) {
  sb.from("works").update({ archive: "ใช้งาน" }).eq("code", code).then(function (r) { if (r.error) toast(r.error.message); else renderArchive(); });
}
function bulkUnarchive() {
  if (!SELECTED.size) return;
  if (!confirm("นำกลับมาใช้งาน " + SELECTED.size + " รายการที่เลือก?")) return;
  sb.from("works").update({ archive: "ใช้งาน" }).in("code", Array.from(SELECTED)).then(function (r) {
    if (r.error) toast(r.error.message); else { toast("นำกลับมาใช้งานแล้ว"); SELECTED.clear(); renderArchive(); }
  });
}
function bulkPermanentDelete(from) {
  if (!SELECTED.size) return;
  var n = SELECTED.size;
  if (!confirm("ลบถาวร " + n + " รายการที่เลือก? กู้คืนไม่ได้เด็ดขาด")) return;
  sb.from("works").delete().in("code", Array.from(SELECTED)).then(function (r) {
    if (r.error) toast(r.error.message);
    else { toast("ลบถาวรแล้ว"); SELECTED.clear(); if (from === "trash") renderTrash(); else renderArchive(); }
  });
}

/* ---------------- heatmap (head only): cross-project overview, no combined score ---------------- */
function renderHeatmap() {
  if (ME.role !== "head") { renderHome(); return; }
  app.innerHTML = shell("heatmap", '<div class="top"><h1>ภาพรวมโครงการ</h1></div>', '<div id="heatBody" class="center"><span class="spin"></span></div>');
  Promise.all([
    sb.from("works").select("*").eq("kind", KIND_PROJECT).eq("archive", "ใช้งาน").order("created_at", { ascending: false }),
    sb.from("fields").select("code,stage,key,value")
  ]).then(function (rs) {
    var box = document.getElementById("heatBody");
    if (rs[0].error) { box.innerHTML = '<div class="err">' + esc(rs[0].error.message) + '</div>'; return; }
    var works = rs[0].data || [];
    var byCode = {};
    (rs[1].data || []).forEach(function (f) { if (!byCode[f.code]) byCode[f.code] = {}; byCode[f.code][f.stage + "|" + f.key] = f.value; });
    if (!works.length) { box.innerHTML = '<div class="center">ยังไม่มีโครงการที่ใช้งานอยู่</div>'; return; }
    box.innerHTML = works.map(function (w) {
      var fmap = byCode[w.code] || {};
      var hb = healthBadge(w, fmap);
      var flow = FLOW[KIND_PROJECT], p = projectProgress(w);
      var tags = ((fmap["0|นโยบาย"] || "").split(",").map(function (s) { return s.trim(); }).filter(Boolean));
      var kpis = kpiListOf(fmap);
      var kpiHtml = kpis.length ? kpis.map(function (k) {
        if (k.type === "text") {
          var st = k.status || KPI_QUAL_OPTS[0];
          return '<span class="hbadge hb-' + (KPI_QUAL_CLS[st] || "risk") + '" style="margin:2px 4px 0 0" title="' + esc(k.name) + '">' + esc(k.name) + ': ' + esc(st) + '</span>';
        }
        var target = numOr0(k.target), actual = Math.max(0, numOr0(k.actual));
        var pct = target > 0 ? Math.min(100, Math.round(actual / target * 100)) : null;
        return '<span class="chip" style="margin:2px 4px 0 0">' + esc(k.name) + ': ' + (pct === null ? (actual + " (ไม่มีเป้า)") : (pct + "%")) + '</span>';
      }).join("") : '<span class="muted">ยังไม่มีตัวชี้วัด</span>';
      return '<div class="card" style="cursor:pointer" onclick="openWork(\'' + esc(w.code) + '\')">' +
        '<span class="chip">' + esc(w.code) + '</span> <span class="hbadge hb-' + hb.cls + '">' + hb.label + '</span> ' +
        tags.map(function (t) { return '<span class="chip">' + esc(t) + '</span>'; }).join("") +
        '<div style="font-weight:600;margin-top:6px">' + esc(w.name) + '</div>' +
        '<div class="strip">' + flow.map(function (s, i) { return '<i class="' + (i < p.filled ? "on" : "") + '"></i>'; }).join("") + '</div>' +
        '<div class="muted" style="margin-top:4px">' + esc(progressLabel(p, flow)) + '</div>' +
        '<div style="margin-top:8px">' + kpiHtml + '</div></div>';
    }).join("");
  });
}

/* ---------------- trash ---------------- */
function renderTrash() {
  SELECTED.clear();
  app.innerHTML = shell("trash", '<div class="top"><h1>ถังขยะ</h1></div>',
    '<div class="card muted">ลบถาวรอัตโนมัติทุกงานที่อยู่ในถังขยะเกิน 30 วัน (ตั้งเวลาไว้ในระบบแล้ว)</div><div id="trashList" class="center"><span class="spin"></span></div>');
  sb.from("works").select("*").eq("archive", "ถังขยะ").order("deleted_at", { ascending: false }).then(function (r) {
    window._trash = r.data || [];
    if (r.error) { document.getElementById("trashList").innerHTML = '<div class="err">' + esc(r.error.message) + '</div>'; return; }
    drawTrash();
  });
}
function drawTrash() {
  var items = window._trash || [];
  var box = document.getElementById("trashList");
  if (!items.length) { box.innerHTML = '<div class="center">ถังขยะว่างเปล่า</div>'; return; }
  box.innerHTML = items.map(function (w) {
    return '<div class="card">' +
      '<label style="position:absolute;top:13px;left:13px" onclick="event.stopPropagation()"><input type="checkbox" onclick="toggleSelect(\'' + esc(w.code) + '\',this.checked);drawTrash()" ' + (SELECTED.has(w.code) ? "checked" : "") + ' style="width:18px;height:18px;margin:0;cursor:pointer"></label>' +
      '<div style="padding-left:28px"><span class="kind ' + (w.kind === KIND_ISSUE ? "k-i" : "k-p") + '">' + esc(w.kind) + '</span> <span class="chip">' + esc(w.code) + '</span>' +
      '<div style="font-weight:600;margin-top:5px">' + esc(w.name) + '</div>' +
      '<div style="display:flex;gap:6px;margin-top:8px">' +
      '<button class="btn bg" onclick="restoreWork(\'' + esc(w.code) + '\')">กู้คืน</button>' +
      '<button class="btn bd" onclick="permanentDelete(\'' + esc(w.code) + '\',\'' + esc(w.name).replace(/'/g, "\\'") + '\')">ลบถาวร</button></div></div></div>';
  }).join("");
  var bar = document.getElementById("bulkBar"); if (bar) bar.remove();
  if (SELECTED.size > 0) {
    var b = document.createElement("div");
    b.id = "bulkBar";
    b.style.cssText = "position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom));background:#111827;color:#fff;padding:10px 14px;border-radius:14px;box-shadow:0 12px 32px -12px rgba(17,24,39,.5);z-index:55;display:flex;gap:8px;align-items:center;flex-wrap:wrap;max-width:92vw;justify-content:center";
    b.innerHTML = '<span style="font-size:13px;font-weight:600">เลือกแล้ว ' + SELECTED.size + ' รายการ</span>' +
      '<button style="background:#fff;color:#111827;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="bulkRestore()">กู้คืนที่เลือก</button>' +
      '<button style="background:#fca5a5;color:#7f1d1d;border:none;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="bulkPermanentDelete(\'trash\')">ลบถาวรที่เลือก</button>' +
      '<button style="background:transparent;color:#cbd5e1;border:1px solid #374151;border-radius:8px;padding:7px 12px;font-size:12.5px;font-weight:600;cursor:pointer" onclick="SELECTED.clear();drawTrash()">ยกเลิก</button>';
    document.body.appendChild(b);
  }
}
function bulkRestore() {
  if (!SELECTED.size) return;
  if (!confirm("กู้คืน " + SELECTED.size + " รายการที่เลือก?")) return;
  sb.from("works").update({ archive: "ใช้งาน", deleted_at: null }).in("code", Array.from(SELECTED)).then(function (r) {
    if (r.error) toast(r.error.message); else { toast("กู้คืนแล้ว"); SELECTED.clear(); renderTrash(); }
  });
}
function restoreWork(code) {
  if (!confirm("กู้คืนงานนี้กลับมาใช้งาน?")) return;
  sb.from("works").update({ archive: "ใช้งาน", deleted_at: null }).eq("code", code).then(function (r) { if (r.error) toast(r.error.message); else renderTrash(); });
}
function permanentDelete(code, name) {
  var t = prompt('พิมพ์ชื่องาน "' + name + '" เพื่อยืนยันลบถาวร (กู้คืนไม่ได้)');
  if (t !== name) { if (t !== null) toast("ชื่อไม่ตรง ยกเลิกการลบ"); return; }
  sb.from("works").delete().eq("code", code).then(function (r) { if (r.error) toast(r.error.message); else { toast("ลบถาวรแล้ว"); renderTrash(); } });
}

/* ---------------- users + backup (head only) ---------------- */
function renderUsers() {
  app.innerHTML = shell("users", '<div class="top"><h1>จัดการผู้ใช้</h1></div>',
    '<div class="card"><div style="font-weight:600;margin-bottom:6px">สร้างบัญชีใหม่</div>' +
    '<label>ชื่อที่แสดง</label><input id="nu_name">' +
    '<label>อีเมล</label><input id="nu_email" type="email">' +
    '<label>รหัสผ่านตั้งต้น</label><input id="nu_pass" type="text" placeholder="อย่างน้อย 6 ตัวอักษร">' +
    '<label>บทบาท</label><select id="nu_role"><option value="member">สมาชิก</option><option value="head">หัวจ่าย</option></select>' +
    '<button class="btn bp" style="margin-top:8px" onclick="createUserAsHead()">สร้างบัญชี</button>' +
    '<div class="muted" style="margin-top:6px">แจ้งอีเมล+รหัสผ่านนี้ให้เจ้าตัวไปเข้าสู่ระบบเองอีกที</div></div>' +
    '<div id="userList" class="center"><span class="spin"></span></div>' +
    '<div class="card"><div style="font-weight:600;margin-bottom:6px">สำรองข้อมูล</div>' +
    '<div class="muted" style="margin-bottom:8px">ระบบสำรองข้อมูลอัตโนมัติทุกวันอาทิตย์อยู่แล้ว หรือกดสำรองเองตอนนี้ก็ได้</div>' +
    '<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn bp" onclick="backupNow()">สำรองข้อมูลตอนนี้</button><button class="btn bg" onclick="downloadBackup()">ดาวน์โหลดสำรองล่าสุด</button></div></div>');
  loadUserList();
}
function loadUserList() {
  sb.from("profiles").select("*").order("created_at").then(function (r) {
    var box = document.getElementById("userList");
    if (r.error) { box.innerHTML = '<div class="err">' + esc(r.error.message) + '</div>'; return; }
    box.innerHTML = (r.data || []).map(function (u) {
      var me = u.id === ME.id;
      return '<div class="card">' +
        '<label>ชื่อที่แสดง</label><input value="' + esc(u.name) + '" onchange="renameUser(\'' + u.id + '\',this.value)">' +
        '<div class="muted" style="margin-top:4px">' + esc(u.email) + ' <span style="opacity:.7">(เปลี่ยนอีเมลทำในแอปนี้ไม่ได้ ต้องให้เจ้าตัวเปลี่ยนเอง)</span></div>' +
        '<label>บทบาท</label><select onchange="setRole(\'' + u.id + '\',this.value)" ' + (me ? "disabled" : "") + '>' +
        '<option value="member"' + (u.role === "member" ? " selected" : "") + '>สมาชิก</option>' +
        '<option value="head"' + (u.role === "head" ? " selected" : "") + '>หัวจ่าย</option></select>' +
        (me ? "" : '<button class="btn bd" style="margin-top:9px" onclick="deleteMember(\'' + u.id + '\',\'' + esc(u.name).replace(/'/g, "\\'") + '\')">ลบสมาชิกออกจากระบบ</button>') +
        '</div>';
    }).join("");
  });
}
function setRole(id, role) {
  sb.from("profiles").update({ role: role }).eq("id", id).then(function (r) { if (r.error) toast(r.error.message); else toast("ปรับสิทธิ์แล้ว"); });
}
function renameUser(id, name) {
  name = name.trim();
  if (!name) { toast("ชื่อห้ามว่าง"); loadUserList(); return; }
  sb.from("profiles").update({ name: name }).eq("id", id).then(function (r) { if (r.error) toast(r.error.message); else toast("แก้ชื่อแล้ว"); });
}
function deleteMember(id, name) {
  if (!confirm('ลบ "' + name + '" ออกจากระบบ?\nคนนี้จะเข้าเว็บนี้ไม่ได้อีก (แต่บัญชีอีเมลเดิมยังสมัครใหม่กลับเข้ามาได้ถ้าจำเป็น)')) return;
  sb.from("profiles").delete().eq("id", id).then(function (r) { if (r.error) toast(r.error.message); else { toast("ลบสมาชิกแล้ว"); loadUserList(); } });
}
function createUserAsHead() {
  var name = document.getElementById("nu_name").value.trim();
  var email = document.getElementById("nu_email").value.trim();
  var pass = document.getElementById("nu_pass").value;
  var role = document.getElementById("nu_role").value;
  if (!name || !email || !pass) { toast("กรอกให้ครบ"); return; }
  if (pass.length < 6) { toast("รหัสผ่านต้องมีอย่างน้อย 6 ตัวอักษร"); return; }
  sb.auth.getSession().then(function (cur) {
    var headSession = cur.data.session;
    sb.auth.signUp({ email: email, password: pass, options: { data: { name: name } } }).then(function (r) {
      if (r.error) { toast(r.error.message); return; }
      var newUserId = r.data.user ? r.data.user.id : null;
      sb.auth.setSession({ access_token: headSession.access_token, refresh_token: headSession.refresh_token }).then(function () {
        if (role === "head" && newUserId) {
          sb.from("profiles").update({ role: "head" }).eq("id", newUserId).then(function () { toast("สร้างบัญชีแล้ว"); renderUsers(); });
        } else { toast("สร้างบัญชีแล้ว"); renderUsers(); }
      });
    });
  });
}
function backupNow() {
  sb.rpc("take_backup").then(function (r) { if (r.error) toast(r.error.message); else toast("สำรองข้อมูลแล้ว"); });
}
function downloadBackup() {
  sb.from("backups").select("*").order("taken_at", { ascending: false }).limit(1).then(function (r) {
    if (r.error) return toast(r.error.message);
    if (!r.data || !r.data.length) return toast("ยังไม่มีสำรองข้อมูล — กดสำรองข้อมูลตอนนี้ก่อน");
    var blob = new Blob([JSON.stringify(r.data[0].data, null, 2)], { type: "application/json" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "backup_" + r.data[0].taken_at.slice(0, 10) + ".json";
    a.click();
  });
}

/* ---------------- utils ---------------- */
var _searchT;
function onSearchInput(v) { clearTimeout(_searchT); _searchT = setTimeout(function () { F_SEARCH = v; drawHome(); }, 300); }
function toast(t) { var e = document.createElement("div"); e.className = "toast"; e.textContent = t; document.body.appendChild(e); setTimeout(function () { e.remove(); }, 2800); }
function esc(s) { if (s === null || s === undefined) return ""; return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;"); }
</script>
